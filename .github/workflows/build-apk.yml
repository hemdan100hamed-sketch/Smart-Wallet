name: Build Smart Wallet APK

on:
  push:
    branches: [ "main", "transfer-prefill-ui", "feature/manual-transfer-receipt-v3.9", "feature/manual-transfer-receipt-v3.10", "feature/receipt-redesign-v3.11", "feature/receipt-redesign-v3.11-side-by-side" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found."
            exit 1
          fi
          # sdkmanager exits after reading all licenses; yes may receive SIGPIPE.
          # Disable pipefail only for this license-acceptance pipeline.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate launcher icons from 02.ico
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            convert '02.ico[0]' -background none -resize ${size}x${size} -gravity center -extent ${size}x${size} PNG32:app/src/main/res/mipmap-${density}/ic_launcher.png
          done
          convert '02.ico[0]' -background none -resize 72x72 -gravity center -extent 108x108 PNG32:app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.png

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Wallet-3.11-side-by-side
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
