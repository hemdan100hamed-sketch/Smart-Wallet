plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartwallet.app'
    compileSdk 35

    defaultConfig {
        // Separate package so 3.11 can be installed beside 3.10 without touching its data.
        applicationId 'com.smartwallet.app.v311'
        minSdk 23
        targetSdk 34
        versionCode 41
        versionName '3.11'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
