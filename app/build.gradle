plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartwallet.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartwallet.app'
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName '3.1'
