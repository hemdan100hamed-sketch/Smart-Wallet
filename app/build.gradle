plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartwallet.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartwallet.app'
        minSdk 23
        targetSdk 34
        versionCode 41
        versionName '3.11'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
